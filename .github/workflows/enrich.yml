name: Génération de l'export OpenData enrichi

# Ce workflow se déclenche :
# - automatiquement une fois par jour à 04h00 UTC (06h00 Paris en été)
#   pour maintenir l'export enrichi à jour sans alourdir les sync horaires
# - manuellement via le bouton "Run workflow" si besoin d'un rafraîchissement
#   ponctuel (par exemple juste avant un examen en commission)
#
# Il fetch 1500+ XML d'amendements, soit ~3 minutes de runtime et autant de
# requêtes vers les serveurs de l'Assemblée nationale. La fréquence quotidienne
# reste très raisonnable et le fichier produit (~plusieurs Mo) ne pollue pas
# l'historique git autant qu'avec une génération horaire.

on:
  schedule:
    # 04h00 UTC = 05h00 (hiver) / 06h00 (été) Paris.
    # Choix d'une heure creuse pour limiter les conflits avec la sync horaire
    # (la sync tourne à HH:00, donc on évite ce créneau précis).
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "enrich-export"
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate enriched Excel
        run: python scripts/generate_excel_enrichi.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/export_amendements_enrichi.xlsx

          if git diff --staged --quiet; then
            echo "Aucune modification à committer."
          else
            git commit -m "Mise à jour export OpenData enrichi"
            for i in 1 2 3; do
              if git push; then
                echo "Commit poussé"
                break
              fi
              echo "Push refusé (tentative $i/3) — rebase puis retry"
              git fetch origin main
              git rebase -X ours origin/main || (
                git rebase --abort 2>/dev/null || true
                git reset --soft origin/main
                git add data/export_amendements_enrichi.xlsx
                git commit -m "Mise à jour export OpenData enrichi"
              )
            done
          fi

# Note : pas de job de déploiement Pages ici. Le commit ci-dessus déclenche
# automatiquement le workflow "Déploiement GitHub Pages" qui se charge de
# publier la nouvelle version du site.

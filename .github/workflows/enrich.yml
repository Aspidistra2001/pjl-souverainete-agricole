name: Génération de l'export OpenData enrichi

# Ce workflow ne se déclenche QUE manuellement (pas de cron) parce qu'il fetch
# 1500+ XML d'amendements, soit ~3 minutes de runtime et autant de requêtes
# vers les serveurs de l'Assemblée nationale. À ne lancer que ponctuellement.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "enrich-export"
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate enriched Excel
        run: python scripts/generate_excel_enrichi.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/export_amendements_enrichi.xlsx

          if git diff --staged --quiet; then
            echo "Aucune modification à committer."
          else
            git commit -m "Mise à jour export OpenData enrichi"
            for i in 1 2 3; do
              if git push; then
                echo "Commit poussé"
                break
              fi
              echo "Push refusé (tentative $i/3) — rebase puis retry"
              git fetch origin main
              git rebase -X ours origin/main || (
                git rebase --abort 2>/dev/null || true
                git reset --soft origin/main
                git add data/export_amendements_enrichi.xlsx
                git commit -m "Mise à jour export OpenData enrichi"
              )
            done
          fi

  # Job de déploiement Pages : ne s'exécute que si le job enrich a committé
  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (post-commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

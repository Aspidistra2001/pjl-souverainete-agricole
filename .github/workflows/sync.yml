name: Sync amendements (RSS + OpenData AN)

on:
  schedule:
    # Toutes les 30 minutes (UTC). Note : GitHub honore parfois ce timer
    # avec un délai de quelques minutes, c'est normal.
    - cron: "0 * * * *"
  workflow_dispatch:  # déclenchement manuel possible

permissions:
  contents: write   # nécessaire pour committer les MAJ de data/amendments.json

# On ne lance pas plusieurs syncs en parallèle
concurrency:
  group: "sync-amendements"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sync script
        run: python scripts/refresh_amendments.py

      - name: Commit & push
        run: |
          if [ -f .sync_summary.txt ]; then
            COMMIT_MSG=$(head -n1 .sync_summary.txt)
          else
            COMMIT_MSG="Sync (no summary)"
          fi
          rm -f .sync_summary.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # data/sync_status.json est mis à jour à chaque exécution :
          # on le committe systématiquement pour garder une trace de la sync
          git add data/sync_status.json
          # data/amendments.json n'est committé que s'il y a un VRAI changement
          git add data/amendments.json

          if git diff --staged --quiet; then
            echo "Aucune modification à committer."
          else
            # Si seul sync_status.json a changé : message minimal
            if git diff --staged --name-only | grep -q '^data/amendments.json$'; then
              git commit -m "$COMMIT_MSG"
            else
              git commit -m "Heartbeat sync — pas de changement"
            fi

            # Push avec gestion des conflits :
            # si quelqu'un a poussé entre-temps, on rebase et on retente.
            # 3 tentatives max pour éviter une boucle infinie.
            for i in 1 2 3; do
              if git push; then
                echo "Commit poussé"
                break
              else
                echo "Push refusé (tentative $i/3) — rebase puis retry"
                git pull --rebase origin main
              fi
            done
          fi

name: Sync amendements (RSS + OpenData AN)

on:
  schedule:
    # Toutes les heures pile (UTC).
    - cron: "0 * * * *"
  workflow_dispatch:  # déclenchement manuel possible

# Permissions étendues : on a besoin de committer ET de déployer Pages
permissions:
  contents: write
  pages: write
  id-token: write

# On ne lance pas plusieurs syncs en parallèle
concurrency:
  group: "sync-amendements"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Variable de sortie : indique si un commit a été fait (donc si on doit redéployer)
    outputs:
      committed: ${{ steps.push.outputs.committed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Run sync script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh_amendments.py

      - name: Commit & push
        id: push
        run: |
          if [ -f .sync_summary.txt ]; then
            COMMIT_MSG=$(head -n1 .sync_summary.txt)
          else
            COMMIT_MSG="Sync (no summary)"
          fi
          rm -f .sync_summary.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/sync_status.json
          git add data/amendments.json
          git add data/export_amendements_tous.xlsx
          git add data/export_amendements_cd.xlsx
          git add data/export_amendements_ce.xlsx
          git add data/export_amendements_an.xlsx

          if git diff --staged --quiet; then
            echo "Aucune modification à committer."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            if git diff --staged --name-only | grep -q '^data/amendments.json$'; then
              git commit -m "$COMMIT_MSG"
            else
              git commit -m "Heartbeat sync — pas de changement"
            fi

            # Push avec gestion des conflits.
            # data/amendments.json et data/sync_status.json sont régénérés intégralement
            # par chaque exécution du script à partir du CSV OpenData (source de vérité).
            # En cas de conflit avec une version distante, la version locale gagne
            # systématiquement : on utilise la stratégie "ours" du rebase.
            for i in 1 2 3; do
              if git push; then
                echo "Commit poussé (tentative $i)"
                echo "committed=true" >> "$GITHUB_OUTPUT"
                break
              fi
              echo "Push refusé (tentative $i/3) — rebase avec stratégie ours"
              # Stratégie : récupérer le distant, et en cas de conflit
              # sur les fichiers de données, garder NOTRE version (= sync.json + amendments.json
              # régénérés par cette exécution).
              git fetch origin main
              if ! git rebase -X ours origin/main; then
                echo "Rebase auto échoué, tentative de résolution forcée"
                # Fallback : on annule et on retente différemment
                git rebase --abort 2>/dev/null || true
                # Reset à origin puis on rajoute nos fichiers par-dessus
                git reset --soft origin/main
                git add data/sync_status.json data/amendments.json
                git add data/export_amendements_tous.xlsx
                git add data/export_amendements_cd.xlsx
                git add data/export_amendements_ce.xlsx
                git add data/export_amendements_an.xlsx
                git commit --amend -m "$COMMIT_MSG" --no-edit || git commit -m "$COMMIT_MSG"
              fi
            done

            # Vérification finale : si après 3 tentatives toujours pas poussé, on signale
            if ! git diff origin/main --quiet 2>/dev/null; then
              echo "⚠ Warning : le push final a peut-être échoué"
            fi
          fi

  # Job de déploiement Pages : ne s'exécute que si la sync a effectivement committé.
  # Nécessaire car les commits de github-actions[bot] ne déclenchent pas
  # automatiquement le workflow deploy.yml (protection anti-boucle de GitHub).
  deploy:
    needs: sync
    if: needs.sync.outputs.committed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (post-commit)
        uses: actions/checkout@v4
        with:
          ref: main      # récupère le commit qu'on vient de pousser

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


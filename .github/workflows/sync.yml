name: Sync amendements (RSS + OpenData AN)

on:
  schedule:
    # Toutes les heures pile (UTC).
    - cron: "0 * * * *"
  workflow_dispatch:  # déclenchement manuel possible

# Permissions étendues : on a besoin de committer ET de déployer Pages
permissions:
  contents: write
  pages: write
  id-token: write

# On ne lance pas plusieurs syncs en parallèle
concurrency:
  group: "sync-amendements"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Variable de sortie : indique si un commit a été fait (donc si on doit redéployer)
    outputs:
      committed: ${{ steps.push.outputs.committed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sync script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh_amendments.py

      - name: Commit & push
        id: push
        run: |
          if [ -f .sync_summary.txt ]; then
            COMMIT_MSG=$(head -n1 .sync_summary.txt)
          else
            COMMIT_MSG="Sync (no summary)"
          fi
          rm -f .sync_summary.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/sync_status.json
          git add data/amendments.json

          if git diff --staged --quiet; then
            echo "Aucune modification à committer."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            if git diff --staged --name-only | grep -q '^data/amendments.json$'; then
              git commit -m "$COMMIT_MSG"
            else
              git commit -m "Heartbeat sync — pas de changement"
            fi

            for i in 1 2 3; do
              if git push; then
                echo "Commit poussé"
                echo "committed=true" >> "$GITHUB_OUTPUT"
                break
              else
                echo "Push refusé (tentative $i/3) — rebase puis retry"
                git pull --rebase origin main
              fi
            done
          fi

  # Job de déploiement Pages : ne s'exécute que si la sync a effectivement committé.
  # Nécessaire car les commits de github-actions[bot] ne déclenchent pas
  # automatiquement le workflow deploy.yml (protection anti-boucle de GitHub).
  deploy:
    needs: sync
    if: needs.sync.outputs.committed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (post-commit)
        uses: actions/checkout@v4
        with:
          ref: main      # récupère le commit qu'on vient de pousser

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

